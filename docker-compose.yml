services:
  postgres:
    image: postgres:16-alpine
    container_name: arenosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservations_db
      POSTGRES_USER: arenosa
      POSTGRES_PASSWORD: arenosa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arenosa -d reservations_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
